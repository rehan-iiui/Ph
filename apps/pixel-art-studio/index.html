<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Pixel Art Studio</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    min-height:100vh;
    background:
        radial-gradient(circle at top left,#5b35ff,transparent 35%),
        radial-gradient(circle at bottom right,#00c8ff,transparent 35%),
        #080a15;
    color:white;
    padding:15px;
}

.app{
    max-width:1000px;
    margin:auto;
}

header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:15px;
}

.logo{
    font-size:25px;
    font-weight:800;
}

.logo span{
    color:#9a7cff;
}

.top-buttons{
    display:flex;
    gap:8px;
}

button{
    border:0;
    cursor:pointer;
    color:white;
    background:rgba(255,255,255,.1);
    border-radius:12px;
    padding:10px 14px;
    font-weight:bold;
}

button:hover{
    background:rgba(255,255,255,.2);
}

.workspace{
    display:grid;
    grid-template-columns:220px 1fr;
    gap:15px;
}

.panel{
    background:rgba(15,18,38,.88);
    border:1px solid rgba(255,255,255,.1);
    border-radius:22px;
    padding:16px;
    backdrop-filter:blur(20px);
}

.panel h3{
    margin-bottom:12px;
}

.tools{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
}

.tool{
    min-height:48px;
}

.tool.active{
    background:#725cff;
}

.colors{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:7px;
    margin-top:10px;
}

.color{
    width:31px;
    height:31px;
    border-radius:8px;
    border:2px solid transparent;
    cursor:pointer;
}

.color.selected{
    border:2px solid white;
    transform:scale(1.1);
}

.custom-color{
    width:100%;
    height:42px;
    margin-top:10px;
    border:0;
    padding:0;
    background:none;
    cursor:pointer;
}

.size-control{
    margin-top:20px;
}

.size-control input{
    width:100%;
    accent-color:#806cff;
}

.grid-size{
    margin-top:20px;
}

.grid-size select{
    width:100%;
    padding:10px;
    border-radius:10px;
    border:0;
    background:#252840;
    color:white;
}

.canvas-panel{
    min-width:0;
    display:flex;
    flex-direction:column;
    align-items:center;
}

.canvas-wrap{
    width:100%;
    overflow:auto;
    padding:15px;
    background:
        repeating-conic-gradient(#ddd 0 25%,#fff 0 50%)
        50% / 20px 20px;
    border-radius:18px;
}

canvas{
    display:block;
    margin:auto;
    background:white;
    image-rendering:pixelated;
    image-rendering:crisp-edges;
    cursor:crosshair;
    box-shadow:0 10px 35px rgba(0,0,0,.35);
}

.status{
    width:100%;
    margin-top:12px;
    display:flex;
    justify-content:space-between;
    color:#9ea2ba;
    font-size:13px;
}

.actions{
    display:flex;
    gap:8px;
    width:100%;
    margin-top:12px;
}

.actions button{
    flex:1;
}

.primary{
    background:linear-gradient(135deg,#806cff,#4e8fff);
}

.danger{
    background:rgba(255,70,90,.18);
}

@media(max-width:750px){
    .workspace{
        grid-template-columns:1fr;
    }

    .panel:first-child{
        order:2;
    }

    .canvas-panel{
        order:1;
    }
}
</style>
</head>

<body>

<div class="app">

<header>
    <div class="logo">🎨 <span>Pixel</span> Art Studio</div>

    <div class="top-buttons">
        <button onclick="undo()">↩</button>
        <button onclick="redo()">↪</button>
    </div>
</header>

<div class="workspace">

<!-- TOOLS -->
<div class="panel">

    <h3>Tools</h3>

    <div class="tools">

        <button class="tool active" id="pencilBtn" onclick="setTool('pencil')">
            ✏️ Pencil
        </button>

        <button class="tool" id="eraserBtn" onclick="setTool('eraser')">
            🧽 Eraser
        </button>

        <button class="tool" id="fillBtn" onclick="setTool('fill')">
            🪣 Fill
        </button>

        <button class="tool" onclick="clearCanvas()">
            🗑️ Clear
        </button>

    </div>

    <h3 style="margin-top:20px;">Colors</h3>

    <div class="colors">

        <div class="color selected" style="background:#000000" onclick="selectColor('#000000',this)"></div>
        <div class="color" style="background:#ffffff" onclick="selectColor('#ffffff',this)"></div>
        <div class="color" style="background:#ff3b30" onclick="selectColor('#ff3b30',this)"></div>
        <div class="color" style="background:#ff9500" onclick="selectColor('#ff9500',this)"></div>
        <div class="color" style="background:#ffcc00" onclick="selectColor('#ffcc00',this)"></div>

        <div class="color" style="background:#34c759" onclick="selectColor('#34c759',this)"></div>
        <div class="color" style="background:#00c7be" onclick="selectColor('#00c7be',this)"></div>
        <div class="color" style="background:#007aff" onclick="selectColor('#007aff',this)"></div>
        <div class="color" style="background:#5856d6" onclick="selectColor('#5856d6',this)"></div>
        <div class="color" style="background:#af52de" onclick="selectColor('#af52de',this)"></div>

        <div class="color" style="background:#ff2d55" onclick="selectColor('#ff2d55',this)"></div>
        <div class="color" style="background:#795548" onclick="selectColor('#795548',this)"></div>
        <div class="color" style="background:#808080" onclick="selectColor('#808080',this)"></div>
        <div class="color" style="background:#222222" onclick="selectColor('#222222',this)"></div>
        <div class="color" style="background:#00e5ff" onclick="selectColor('#00e5ff',this)"></div>

    </div>

    <input
        type="color"
        class="custom-color"
        id="customColor"
        value="#ff00ff"
        onchange="selectCustomColor()"
    >

    <div class="size-control">
        <h3>Brush Size</h3>

        <input
            type="range"
            id="brushSize"
            min="1"
            max="4"
            value="1"
        >

        <div id="sizeText">1 pixel</div>
    </div>

    <div class="grid-size">
        <h3>Canvas Size</h3>

        <select id="gridSize" onchange="changeGridSize()">
            <option value="16">16 × 16</option>
            <option value="24">24 × 24</option>
            <option value="32" selected>32 × 32</option>
            <option value="48">48 × 48</option>
            <option value="64">64 × 64</option>
        </select>
    </div>

</div>

<!-- CANVAS -->
<div class="panel canvas-panel">

    <div class="canvas-wrap">
        <canvas id="canvas" width="640" height="640"></canvas>
    </div>

    <div class="status">
        <span id="toolStatus">Tool: Pencil</span>
        <span id="coords">0, 0</span>
    </div>

    <div class="actions">

        <button class="primary" onclick="saveArt()">
            💾 Save PNG
        </button>

        <button onclick="saveLocal()">
            📦 Save Project
        </button>

        <button onclick="loadLocal()">
            📂 Load
        </button>

    </div>

</div>

</div>

</div>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let grid = 32;
let cellSize = canvas.width / grid;

let color = "#000000";
let tool = "pencil";
let drawing = false;

let history = [];
let historyIndex = -1;

const brushSize = document.getElementById("brushSize");

function setupCanvas(){

    cellSize = canvas.width / grid;

    ctx.clearRect(0,0,canvas.width,canvas.height);

    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    drawGrid();

    saveHistory();

}

function drawGrid(){

    ctx.strokeStyle = "rgba(0,0,0,.12)";
    ctx.lineWidth = 1;

    for(let i=0;i<=grid;i++){

        const pos = i * cellSize;

        ctx.beginPath();
        ctx.moveTo(pos,0);
        ctx.lineTo(pos,canvas.height);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(0,pos);
        ctx.lineTo(canvas.width,pos);
        ctx.stroke();

    }

}

function getCell(event){

    const rect = canvas.getBoundingClientRect();

    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;

    const x =
        Math.floor((event.clientX - rect.left) * scaleX / cellSize);

    const y =
        Math.floor((event.clientY - rect.top) * scaleY / cellSize);

    return {
        x:Math.max(0,Math.min(grid-1,x)),
        y:Math.max(0,Math.min(grid-1,y))
    };

}

function paintCell(x,y){

    const size = Number(brushSize.value);

    for(let dy=0;dy<size;dy++){

        for(let dx=0;dx<size;dx++){

            const px = x + dx;
            const py = y + dy;

            if(px >= grid || py >= grid) continue;

            if(tool === "eraser"){

                ctx.fillStyle = "#ffffff";

            }else{

                ctx.fillStyle = color;

            }

            ctx.fillRect(
                px * cellSize,
                py * cellSize,
                cellSize,
                cellSize
            );

        }

    }

    drawGrid();

}

function fillCanvas(x,y){

    const image = ctx.getImageData(
        0,
        0,
        canvas.width,
        canvas.height
    );

    const targetX = Math.floor(x * cellSize + cellSize/2);
    const targetY = Math.floor(y * cellSize + cellSize/2);

    const index =
        (targetY * canvas.width + targetX) * 4;

    const target = [
        image.data[index],
        image.data[index+1],
        image.data[index+2],
        image.data[index+3]
    ];

    const fillHex = color;

    const temp = document.createElement("canvas");

    temp.width = 1;
    temp.height = 1;

    const tempCtx = temp.getContext("2d");

    tempCtx.fillStyle = fillHex;
    tempCtx.fillRect(0,0,1,1);

    const fillData =
        tempCtx.getImageData(0,0,1,1).data;

    if(
        target[0] === fillData[0] &&
        target[1] === fillData[1] &&
        target[2] === fillData[2]
    ) return;

    const queue = [[x,y]];
    const visited = new Set();

    while(queue.length){

        const [cx,cy] = queue.shift();

        if(cx<0 || cy<0 || cx>=grid || cy>=grid) continue;

        const key = cx + "," + cy;

        if(visited.has(key)) continue;

        visited.add(key);

        const sx = Math.floor(cx*cellSize + cellSize/2);
        const sy = Math.floor(cy*cellSize + cellSize/2);

        const i =
            (sy * canvas.width + sx) * 4;

        const same =
            image.data[i] === target[0] &&
            image.data[i+1] === target[1] &&
            image.data[i+2] === target[2];

        if(!same) continue;

        ctx.fillStyle = fillHex;

        ctx.fillRect(
            cx*cellSize,
            cy*cellSize,
            cellSize,
            cellSize
        );

        queue.push([cx+1,cy]);
        queue.push([cx-1,cy]);
        queue.push([cx,cy+1]);
        queue.push([cx,cy-1]);

    }

    drawGrid();

}

function startDrawing(event){

    drawing = true;

    saveHistory();

    draw(event);

}

function draw(event){

    if(!drawing) return;

    const pos = getCell(event);

    document.getElementById("coords").textContent =
        pos.x + ", " + pos.y;

    if(tool === "fill"){

        fillCanvas(pos.x,pos.y);

        drawing = false;

        saveHistory();

        return;

    }

    paintCell(pos.x,pos.y);

}

function stopDrawing(){

    if(!drawing) return;

    drawing = false;

    saveHistory();

}

canvas.addEventListener("pointerdown",startDrawing);
canvas.addEventListener("pointermove",draw);
canvas.addEventListener("pointerup",stopDrawing);
canvas.addEventListener("pointerleave",stopDrawing);

function setTool(newTool){

    tool = newTool;

    document.querySelectorAll(".tool")
        .forEach(btn=>btn.classList.remove("active"));

    if(newTool === "pencil")
        document.getElementById("pencilBtn").classList.add("active");

    if(newTool === "eraser")
        document.getElementById("eraserBtn").classList.add("active");

    if(newTool === "fill")
        document.getElementById("fillBtn").classList.add("active");

    document.getElementById("toolStatus").textContent =
        "Tool: " +
        newTool.charAt(0).toUpperCase() +
        newTool.slice(1);

}

function selectColor(newColor,element){

    color = newColor;

    document.querySelectorAll(".color")
        .forEach(c=>c.classList.remove("selected"));

    element.classList.add("selected");

    setTool("pencil");

}

function selectCustomColor(){

    color =
        document.getElementById("customColor").value;

    document.querySelectorAll(".color")
        .forEach(c=>c.classList.remove("selected"));

    setTool("pencil");

}

brushSize.addEventListener("input",()=>{

    const value = brushSize.value;

    document.getElementById("sizeText").textContent =
        value + (value == 1 ? " pixel" : " pixels");

});

function clearCanvas(){

    if(!confirm("Clear the whole canvas?")) return;

    saveHistory();

    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    drawGrid();

    saveHistory();

}

function saveHistory(){

    const data =
        ctx.getImageData(
            0,
            0,
            canvas.width,
            canvas.height
        );

    history =
        history.slice(0,historyIndex+1);

    history.push(data);

    historyIndex++;

    if(history.length > 30){

        history.shift();
        historyIndex--;

    }

}

function undo(){

    if(historyIndex <= 0) return;

    historyIndex--;

    ctx.putImageData(
        history[historyIndex],
        0,
        0
    );

    drawGrid();

}

function redo(){

    if(historyIndex >= history.length-1) return;

    historyIndex++;

    ctx.putImageData(
        history[historyIndex],
        0,
        0
    );

    drawGrid();

}

function changeGridSize(){

    grid =
        Number(document.getElementById("gridSize").value);

    setupCanvas();

}

function saveArt(){

    const exportCanvas =
        document.createElement("canvas");

    exportCanvas.width = grid;
    exportCanvas.height = grid;

    const exportCtx =
        exportCanvas.getContext("2d");

    exportCtx.imageSmoothingEnabled = false;

    exportCtx.drawImage(
        canvas,
        0,
        0,
        grid,
        grid
    );

    const link =
        document.createElement("a");

    link.download =
        "pixel-art.png";

    link.href =
        exportCanvas.toDataURL("image/png");

    link.click();

}

function saveLocal(){

    const data =
        canvas.toDataURL("image/png");

    localStorage.setItem(
        "pixelArtProject",
        JSON.stringify({
            grid:grid,
            image:data
        })
    );

    alert("Pixel art project saved!");

}

function loadLocal(){

    const saved =
        localStorage.getItem("pixelArtProject");

    if(!saved){

        alert("No saved project found.");

        return;

    }

    const project =
        JSON.parse(saved);

    grid = project.grid;

    document.getElementById("gridSize").value =
        grid;

    const image =
        new Image();

    image.onload = ()=>{

        ctx.clearRect(
            0,
            0,
            canvas.width,
            canvas.height
        );

        ctx.drawImage(
            image,
            0,
            0,
            canvas.width,
            canvas.height
        );

        drawGrid();

        saveHistory();

    };

    image.src = project.image;

}

setupCanvas();

</script>

</body>
</html>
